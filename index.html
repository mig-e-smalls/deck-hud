/* Layout: one-column table-side HUD; phase rail on top, tracker tiles in a 2-col grid, big thumb targets */
:root{
  --bg:#ECEFE9; --surface:#FFFFFF; --sunk:#E1E6DF; --ink:#1C2320; --muted:#5C6964;

  --line:#2B3732; --accent:#E2B24E; --accent-ink:#1A1405; --good:#5DBB84; --bad:#E7766B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A221F; --sunk:#0C110F; --ink:#ECE7DA; --muted:#97A49E;
  --line:#2B3732; --accent:#E2B24E; --accent-ink:#1A1405; --good:#5DBB84; --bad:#E7766B; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:1.75rem;letter-spacing:.01em}
h2{font-size:1.2rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}

p{margin:0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* deck list */
.decks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.deck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.deck:hover{background:var(--sunk)}
.deck .name{font-family:var(--display);font-size:1.1rem;font-weight:700}
.deck .meta{grid-column:1;font-size:.88rem;color:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1}

/* HUD */
.hudhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.turn{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1}

.ph{border:0;background:none;border-radius:9px;padding:9px 2px;font-size:.78rem;font-weight:600;color:var(--muted)}

.reminders{display:flex;flex-direction:column;gap:8px;min-height:24px}

.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.toggles{display:flex;gap:8px;flex-wrap:wrap}

.bar{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.bar .btn{padding:14px}

/* setup */
.field{display:flex;flex-direction:column;gap:6px}
label.t{font-weight:600;font-size:.9rem}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:120px;resize:vertical;font-size:.9rem}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.check{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:.92rem}
.check input{accent-color:var(--accent);width:18px;height:18px}
.remlist{display:flex;flex-direction:column;gap:6px}
.remitem{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.remitem b{font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.remitem button{border:0;background:none;color:var(--muted);font-size:1.1rem}
.addrem{display:grid;grid-template-columns:110px 1fr;gap:8px}
.addrem .span{grid-column:1/-1}
.confirm{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.status{font-size:.88rem;color:var(--muted)}
.term{font:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px;color:inherit;background:none;border:0;padding:0;display:inline}
.chk{cursor:pointer}
.chk button.box{background:none;color:inherit;padding:0}
.chk.done .box{background:var(--good)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet p{max-width:60ch}
.gloss{margin:0;display:flex;flex-direction:column}
.gloss div{padding:12px 0;border-top:1px solid var(--line)}
.gloss dt{font-family:var(--display);font-weight:700;font-size:1.1rem}
.gloss dd{margin:2px 0 0;color:var(--ink);max-width:62ch}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.opp{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.opp.dead{opacity:.55}
.otop{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.oname{border:0!important;background:none!important;padding:2px 0!important;font-weight:700;font-size:1.05rem;min-width:0}
.olife{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:700;line-height:1}
.obot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ocd{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ocd.hot{color:var(--bad);font-weight:700}
.odmg{display:flex;gap:6px}
.odmg button{border:1px solid var(--line);background:var(--sunk);border-radius:9px;min-width:52px;padding:10px 0;font-weight:700;font-variant-numeric:tabular-nums}
.odmg .heal{color:var(--good)}
.tjoin{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status.err{color:var(--bad)}
.peer{border-top:1px solid var(--line)}
.ptop{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;padding:10px 0}
.ptop:disabled{cursor:default;color:inherit}
.pname{font-weight:700;overflow-wrap:anywhere}
.pname em{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:600;margin-left:4px}
.pstats{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}
.pstats b{color:var(--ink)}
.pdeck{grid-column:1/-1;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.chev{margin-left:4px}
.pbody{display:flex;flex-direction:column;gap:10px;padding:0 0 12px;font-size:.92rem}
.pline{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.pline b{font-variant-numeric:tabular-nums}
.pfx{margin:3px 0}
.card{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.cmain{display:flex;flex-direction:column;min-width:0}
.cname{font-weight:700;overflow-wrap:anywhere}
.csum{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.attach{margin-top:6px;padding:7px 10px;font-size:.88rem}
.btn.make{padding:8px 10px;font-size:.85rem;white-space:nowrap}
.picks{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.cats{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line);padding-top:10px;scrollbar-width:none}
.cat{flex:none;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px;font-weight:600;font-size:.85rem}
.cat span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:2px}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat.on span{color:var(--bg);opacity:.7}
.pip.wide{width:auto;height:auto;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600}
.pip.wide.used{transform:none;text-decoration:line-through}
.fixed{font-variant-numeric:tabular-nums;padding:0 6px}
.turnbox{display:flex;gap:12px;align-items:center;text-align:right}
.chk{display:grid;grid-template-columns:62px 1fr 28px;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;font-size:.95rem;width:100%}
.chk .when{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--accent)}
.chk .ctext{min-width:0;overflow-wrap:anywhere}
.chk .box{width:26px;height:26px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-weight:700}
.chk.done .ctext{color:var(--muted);text-decoration:line-through}
.chk.done .when{color:var(--muted)}
.chk.done .box{background:var(--good);border-color:var(--good);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel.fx{border-color:var(--accent)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:.95rem;padding:6px 0;border-top:1px solid var(--line)}
.line em,.srcname em{font-style:normal;font-size:.75rem;color:var(--muted);margin-left:6px}
.line.hot span{font-weight:700}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;padding:0 6px}
.mana{font-variant-numeric:tabular-nums;color:var(--muted)}
.mana b{font-size:1.5rem;color:var(--ink)}
.src{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.srcname{min-width:0;overflow-wrap:anywhere}
.pips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pip{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-variant-numeric:tabular-nums}
.pip.used{background:transparent;color:var(--muted);border-color:var(--line);transform:rotate(90deg)}
.srcctl{grid-row:1;grid-column:2;display:flex;gap:4px}
.srcctl button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;width:34px;height:30px;font-weight:700}
.addrow{display:grid;grid-template-columns:1fr auto auto auto;gap:6px}
.addrow:has(#add-grp){grid-template-columns:1fr auto auto auto auto}
.buffs{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:.88rem}
.blbl,.glbl{color:var(--muted)}
.bctl{display:flex;align-items:center;gap:4px}

.stp{display:inline-flex;align-items:center;gap:2px}
.stp b{min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}

.grp{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.gtop{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.gname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pt{font-family:var(--display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.gctl{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:6px 10px;align-items:center;font-size:.88rem}
.gbase{font-style:normal;font-size:.75rem;color:var(--muted)}
@media (max-width:420px){.addrow,.addrow:has(#add-grp){grid-template-columns:1fr 1fr}.addrow input{grid-column:1/-1}}

/* ===== Tabletop skin: card-frame panels on a playmat ===== */
:root,:root[data-theme="dark"],:root[data-theme="light"]{
  --bg:#15110e; --surface:#2a221b; --sunk:#221b15; --ink:#efe2c4; --muted:#b6a483;
  --line:#4a3d2f; --accent:#c9a65a; --accent-ink:#1b130a; --good:#3f8a57; --bad:#c2513d;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --body:"Crimson Pro",Georgia,"Times New Roman",serif;
  --gilt:linear-gradient(180deg,#ecd08a 0%,#c9a65a 55%,#a07e38 100%);
  --namebar:linear-gradient(180deg,#eadcb6 0%,#cdb88a 100%);
  color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110e; --surface:#2a221b; --sunk:#221b15; --ink:#efe2c4; --muted:#b6a483;
  --line:#4a3d2f; --accent:#c9a65a; --accent-ink:#1b130a; --good:#3f8a57; --bad:#c2513d; color-scheme:dark}}
html,body{background:radial-gradient(120% 60% at 50% 0%,#2c221a 0%,#15110e 60%,#0e0b09 100%) fixed,#15110e}
body{font-family:var(--body);font-size:17px;line-height:1.45}
h1{font-family:var(--display);font-size:2.1rem;font-weight:700;letter-spacing:.03em;color:#f3e6c6}
h2{font-family:var(--display);font-weight:700;letter-spacing:.02em}
.eyebrow{text-transform:none;letter-spacing:.04em;font-family:var(--display);font-weight:600;font-size:.82rem;color:var(--accent)}
.muted,.note,.status{color:var(--muted)}
.note{border-left-color:#6b5636}

/* Card frame: any panel-like block gets parchment text box inside a dark, gilt-edged frame */
.panel,.tile,.confirm,.sheet,.check,.remitem,.decks .deck{
  --surface:#efe2c4; --sunk:#e0cea4; --ink:#2b2016; --muted:#6e5a40; --line:#c4ab78; --accent:#7a5214; --accent-ink:#1b130a;
  color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%),var(--surface);
  border:2px solid #0e0b08;border-radius:10px;
  box-shadow:0 0 0 3px #3a2f24,0 0 0 4px #8c7448,0 8px 18px rgba(0,0,0,.55)}
.panel{padding:0 12px 12px;gap:8px}
/* Title strip, like a card's name bar */
.panel>.spread:first-child,.panel>.eyebrow:first-child{
  margin:0 -12px 2px;padding:8px 12px;background:var(--namebar);border-bottom:2px solid #2a221b;border-radius:8px 8px 0 0}
.panel>.spread:first-child .eyebrow,.panel>.eyebrow:first-child{display:block;color:#24190f;font-size:1rem;font-weight:700;letter-spacing:.02em}
.panel>.spread:first-child .mana{color:#4b3a24;font-size:.88rem}
.panel>.spread:first-child .mana b{color:#24190f;font-family:var(--display)}
.panel.fx{border-color:#0e0b08}
.panel .link{color:#7a4f12}
.panel>.spread:first-child .link{color:#5b3608}

/* Tiles: life total is the power/toughness plaque */
.tile{padding:0 10px 10px;gap:8px}
.tile .lbl{margin:0 -10px;padding:6px 10px;background:var(--namebar);border-bottom:2px solid #2a221b;border-radius:8px 8px 0 0;
  font-family:var(--display);text-transform:none;letter-spacing:.02em;font-size:.88rem;color:#24190f;font-weight:700}
.tile .val{font-family:var(--display);font-weight:700;color:#24190f}
.tile.wide .val{width:fit-content;margin:4px auto 2px;padding:4px 26px 2px;font-size:3.6rem;
  background:linear-gradient(180deg,#f8eed6,#d2bd8f);border:2px solid #2a221b;border-radius:12px 12px 12px 12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #5e4a2c}
.tile.warn .val{color:var(--bad)}

/* Buttons */
.btn{font-family:var(--display);font-weight:700;letter-spacing:.02em;border-radius:8px;background:#2a221b;color:#efe2c4;border:1px solid #6b5636}
.btn.primary{background:var(--gilt);color:#23190d;border:1px solid #4a3a1f;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #3a2c14}
.btn.ghost{background:transparent}
.panel .btn,.confirm .btn,.sheet .btn{background:var(--sunk);color:var(--ink);border-color:#a88d5c}
.panel .btn.primary,.confirm .btn.primary,.sheet .btn.primary{background:var(--gilt);color:#23190d;border-color:#4a3a1f}
.btn.danger{color:var(--bad);border-color:var(--bad)}

function syncDraft(){
  if(view!=="setup")return;
  const v=id=>document.getElementById(id);
  draft.name=v("f-name").value.trim();draft.cmdr=v("f-cmdr").value.trim();draft.cmdr2=v("f-cmdr2")?v("f-cmdr2").value.trim():(draft.cmdr2||"");
  draft.list=v("f-list")?v("f-list").value:"";
  draft.mods=[...document.querySelectorAll("[data-mod]")].filter(x=>x.checked).map(x=>x.dataset.mod);
  draft.custom=v("f-custom").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,8);
}

// Decklist import: look every card up on Scryfall, then derive trackers, card effects, mana and token types from its rules text.
function parseList(text){

async function scryfall(names,onProgress){
  const found=[],missing=[];
  for(let i=0;i<names.length;i+=75){
    const chunk=names.slice(i,i+75);
    const r=await fetch("https://api.scryfall.com/cards/collection",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({identifiers:chunk.map(name=>({name}))})});

    const j=await r.json();found.push(...(j.data||[]));missing.push(...(j.not_found||[]).map(x=>x.name));
    onProgress&&onProgress(Math.min(i+75,names.length),names.length);
    await new Promise(res=>setTimeout(res,120));

}
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function analyzeCard(c){
  const faces=c.card_faces&&!c.oracle_text?c.card_faces:[c];
  const text=faces.map(f=>f.oracle_text||"").join("\n").replace(/\([^)]*\)/g,"").trim();
  const type=faces.map(f=>f.type_line||"").join(" // ")||c.type_line||"";
  const name=c.name.split(" // ")[0];
  const res={mods:new Set(),card:null,group:null};
  const t=text.toLowerCase();
  if(/\{e\}/i.test(text)||/\benergy counter/.test(t))res.mods.add("energy");
  if(/rad counter/.test(t))res.mods.add("rad");
  if(/experience counter/.test(t))res.mods.add("exp");
  if(/\bstorm\b|spells? you(?:'ve)? cast this turn|you've cast this turn/.test(t))res.mods.add("storm");
  if(/treasure/.test(t))res.mods.add("treasure");
  if(/\bfood\b/.test(t))res.mods.add("food");
  if(/\bclue\b|investigate/.test(t))res.mods.add("clue");
  if(/\bjunk\b/.test(t))res.mods.add("junk");
  if(/the monarch/.test(t))res.mods.add("monarch");
  if(/the initiative/.test(t))res.mods.add("initiative");
  if(/daybound|nightbound|it becomes (day|night)/.test(t))res.mods.add("daynight");
  if(/poison counter|\binfect\b|\btoxic\b|\bpoisonous\b/.test(t))res.mods.add("poison");
  // Only permanents can be "in play".
  if(/\b(instant|sorcery|land)\b/i.test(type)&&!/creature|artifact|enchantment|planeswalker|battle/i.test(type))return res;
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const rem=[],fx=[];let mana=0,buff=null,gyab="";
  for(const raw of lines){
    const l=raw.replace(/^[^—{}]{2,40} — /,""),ll=l.toLowerCase();
    let p=null;
    if(/^(at the beginning of your upkeep|at the beginning of each upkeep)/.test(ll))p="up";
    else if(/^at the beginning of your draw step/.test(ll))p="draw";
    else if(/^at the beginning of (combat|each combat)/.test(ll)||/^whenever .{0,60}\battacks?\b/.test(ll)||/deals combat damage/.test(ll))p="combat";
    else if(/^at the beginning of (your|each) end step|^at the beginning of the end step/.test(ll))p="end";
    else if(/^at the beginning of your (precombat|first) main phase/.test(ll))p="m1";
    else if(/^(whenever|when .* (dies|leaves)|at the beginning)/.test(ll)&&!/^when .* enters/.test(ll))p="m1";
    if(p){rem.push([p,l.slice(0,150)]);fx.push(l);continue;}
    const add=l.match(/^\{T\}(?:, [^:]+)?: Add ((?:\{[^}]+\})+)/);
    if(add){mana=Math.max(mana,(add[1].match(/\{[^}]+\}/g)||[]).length);continue;}
    const anyAdd=l.match(/^\{T\}: Add (one|two|three) mana/i);if(anyAdd){mana=Math.max(mana,NUMW[anyAdd[1].toLowerCase()]);continue;}
    const b=l.match(/(?:other )?creatures you control get \+(\d+)\/\+(\d+)/i);
    if(b){buff={p:+b[1],t:+b[2]};}
    if(/^(flying|vigilance|trample|haste|deathtouch|lifelink|reach|menace|first strike|double strike|flash|hexproof|indestructible|defender|ward|crew|equip|enchant|unearth|cascade|squad|miracle|evolve|ravenous)\b/i.test(l)&&l.length<40)continue;
    {const gm=l.match(GYKW);if(gm&&/^(unearth|flashback|escape|embalm|eternalize|disturb|scavenge|retrace|encore|jump-start|aftermath)\b/i.test(l))gyab=(gm[1]+" "+gm[2]).trim();}
    if(/^([a-z]*cycling|flashback|embalm|eternalize|escape|encore|foretell|madness|evoke|dash|retrace|scavenge|transmute|disturb|blitz|ninjutsu|kicker|multikicker|buyback|morph|megamorph|disguise|channel|plot|aftermath|jump-start|overload|emerge|spectacle|surge|prowl|replicate|entwine|suspend)\b/i.test(l))continue;
    if(/^when .* enters/i.test(l))continue;
    if(/^[^:]{0,60}:/.test(l)&&!/^[A-Z][^{]*—/.test(l))continue; // activated abilities: skip from always-on effects
    if(l.length>4)fx.push(l);
  }
  // Token types this card makes.
  const tok=text.match(/create (a|an|one|two|three|four|five|x|\d+) (?:tapped )?(\d+)\/(\d+) ((?:white|blue|black|red|green|colorless|and| )*)?([A-Z][A-Za-z' ]+?) (?:artifact )?creature tokens?/i);
  if(tok){const n=NUMW[tok[1].toLowerCase()]||parseInt(tok[1],10)||0;res.group={name:tok[5].trim()+" tokens",p:+tok[2],t:+tok[3]};if(n)res.make=n;}
  const cat=/vehicle/i.test(type)?"Vehicles":/creature/i.test(type)?"Creatures":mana?"Mana":/artifact/i.test(type)?"Artifacts":/enchantment/i.test(type)?"Enchantments":"Other";
  const f0=faces[0]||{},pw=c.power??f0.power,tg=c.toughness??f0.toughness;
  if(true){
    res.card={name,cat};if(pw!=null&&tg!=null)res.card.pt=pw+"/"+tg;if(gyab)res.card.gy=gyab;
    if(rem.length)res.card.rem=rem.slice(0,3);
    if(fx.length)res.card.fx=fx.slice(0,2).join(" ").slice(0,200);
    if(mana)res.card.mana=mana;
    if(buff)res.card.buff=buff;
    if(res.group&&res.make){res.card.make=res.make;res.card.makeGroup=res.group.name;}
  }
  return res;
}
// Turn a list of Scryfall-shaped cards into trackers, card entries, token groups and colors.
function buildFromCards(found,base){
  const mods=new Set(base.mods&&base.mods.length?base.mods:["life","cmdr"]);mods.add("life");mods.add("cmdr");
  const cards=new Map((base.cards||[]).map(c=>[c.name,c])),groups=new Map((base.groups||[]).map(g=>[g.name,g]));
  const rem=[...(base.rem||[])];const cmdrName=(base.cmdr||"").toLowerCase();
  for(const c of found){
    const r=analyzeCard(c);r.mods.forEach(m=>mods.add(m));
    if(r.group&&!groups.has(r.group.name))groups.set(r.group.name,r.group);
    if(!r.card)continue;
    if(isCmdr(base,r.card.name)){(r.card.rem||[]).forEach(x=>{if(!rem.some(y=>y[1]===x[1]))rem.push([x[0],x[1]]);});continue;}
    cards.set(r.card.name,r.card);
  }
  let colors=base.colors||[];
  if(!colors.length){const cm=found.find(c=>isCmdr(base,c.name));
    const ci=cm?cm.color_identity:[...new Set(found.flatMap(c=>c.color_identity||[]))];colors=["W","U","B","R","G"].filter(x=>(ci||[]).includes(x));}
  return {mods:[...mods],cards:[...cards.values()].slice(0,120),groups:[...groups.values()].slice(0,8),rem,colors};

// Every Commander precon ever printed, from MTGJSON (free, public data).
const MTGJSON="https://mtgjson.com/api/v5/";
let catalog=null,catState="idle",catQuery="",catErr="",catBusy=null;
async function loadCatalog(){
  if(catState==="loading")return;
  try{const c=JSON.parse(localStorage.getItem("deckhud.catalog")||"null");if(c&&Date.now()-c.t<7*864e5){catalog=c.d;catState="ready";return render();}}catch(e){}
  catState="loading";render();
  try{
    // 1) the copy on this site, built weekly by the GitHub job; 2) MTGJSON live.
    try{const r=await fetch("precons/index.json",{cache:"no-cache"});if(!r.ok)throw 0;const j=await r.json();
      catalog=(j.decks||[]).map(d=>({f:d.f,n:d.n,c:d.c,d:d.d||"",cm:d.cm||[],ci:d.ci||[],local:true}));if(!catalog.length)throw 0;}
    catch(_){const r=await fetch(MTGJSON+"DeckList.json");if(!r.ok)throw 0;const j=await r.json();
      catalog=(j.data||[]).filter(d=>/commander/i.test(d.type||"")).map(d=>({f:d.fileName,n:d.name,c:d.code,d:d.releaseDate||""}));}

async function importPrecon(f,viewOnly){

    catch(_){const r=await fetch(MTGJSON+"decks/"+encodeURIComponent(f)+".json");if(!r.ok)throw 0;deck=(await r.json()).data;
      const conv=c=>({name:c.name,type_line:c.type||"",oracle_text:c.text||"",color_identity:c.colorIdentity||[],power:c.power,toughness:c.toughness,q:c.count||1});

      found.forEach(fc=>{const t=all.find(c=>normName(c.name)===normName(fc.name));if(t){const fx=fc.card_faces&&!fc.oracle_text?fc.card_faces:[fc];
        t.oracle_text=fx.map(x=>x.oracle_text||"").join("\n");t.type_line=fc.type_line||t.type_line;t.color_identity=fc.color_identity||t.color_identity;}});}catch(_){}}

async function suggest(){

  if(!names.length){aiStatus="Paste a decklist first.";return render();}
  aiStatus=`Looking up ${names.length} cards…`;render();

    let picked="";

    else if(a==="mill"){if((g.lib||0)<=0)g.simNote="Your library is empty.";else{g.lib--;addOpen="gy";g.simNote="Name the milled card, or cancel to skip.";}}
    save();render();if(addOpen==="gy"){const i=document.getElementById("add-gy");if(i)i.focus();}return;}
  if(ds.dig&&g&&modeOf(g)==="digital"){digAct(g,ds);save();render();if(ds.dig==="find"&&digFind){const i=document.getElementById("dig-q");if(i)i.focus();}return;}
  if(ds.ctlact&&cardOpen){takeCard(cardOpen,ds.ctlact==="copy");return;}
  if(ds.sess&&tableRoom){sessAct(ds);return render();}
  if(ds.seat&&tableRoom){moveSeat(ds.id,Number(ds.seat));return render();}
  if(ds.share&&tableRoom){const k=ds.share;
    if(k==="turn")setTbl({turn:uid});
    else if(k==="dn")setTbl({dn:((tblState.dn||0)+1)%3});
    else if(k==="monarch"||k==="initiative")setTbl({[k]:tblState[k]===uid?null:uid});
    return render();}
  if(ds.k&&g){g.vals[ds.k]=(g.vals[ds.k]||0)+Number(ds.n);if(!ds.k.startsWith("life")&&g.vals[ds.k]<0)g.vals[ds.k]=0;save();return render();}
  if(ds.ph&&g){g.phase=ds.ph;save();return render();}
  if(ds.flag&&g){g.flags[ds.flag]=!g.flags[ds.flag];save();return render();}
  if(ds.cycle&&g){g.flags[ds.cycle]=(g.flags[ds.cycle]+1)%3;save();return render();}
  if(ds.tap!=null&&g){const s=g.sources[ds.tap];const j=[...b.parentNode.children].indexOf(b);s.used=j<s.used?j:j+1;save();return render();}
  if(ds.srcn!=null&&g){const s=g.sources[ds.srcn];s.n=Math.max(0,s.n+Number(ds.d));s.used=Math.min(s.used,s.n);
    if(s.n===0&&s.name!=="Lands")g.sources.splice(Number(ds.srcn),1);keepCarry();save();return render();}
  if(ds.addopen&&g){addOpen=addOpen===ds.addopen?null:ds.addopen;render();const i=document.getElementById("add-"+addOpen);if(i)i.focus();return;}
  if(ds.addgo&&g){const k=ds.addgo,t=(document.getElementById("add-"+k).value||"").trim().slice(0,140);
    if(t){if(k==="src")g.sources.push({name:t,amt:Number(document.getElementById("add-src-amt").value),n:1,used:0});
      if(k==="fx")g.effects.push({text:t,dur:document.getElementById("add-fx-dur").value==="turn"?"turn":"on"});
      if(k==="watch")g.watch.push(t);
      if(k==="gy"){const z=document.getElementById("add-gy-z").value==="ex"?"ex":"gy";g[z].push(t);}
      if(k==="grp")g.groups.push({name:t,p:Number(document.getElementById("add-grp-p").value),t:Number(document.getElementById("add-grp-t").value),n:1,c:0});
      keepCarry();save();}
    addOpen=null;return render();}
  if(ds.gn!=null&&g){const x=g.groups[ds.gn];x.n=Math.max(0,x.n+Number(ds.gd));x.tap=Math.min(x.tap||0,x.n);save();return render();}
  if(ds.mytap&&g){const k=ds.mytap,[kind,rest]=[k.slice(0,k.indexOf(":")<0?k.length:k.indexOf(":")),k.slice(k.indexOf(":")+1)];
    if(k==="cmdr"){g.cmdr.tap=!g.cmdr.tap;}else if(k==="cmdr2"){g.cmdr2.tap=!g.cmdr2.tap;}
    else if(kind==="card"){g.cardUsed=g.cardUsed||{};if(g.inplay.includes(rest))g.cardUsed[rest]=!g.cardUsed[rest];}
    else if(kind==="grpU"||kind==="grpT"){const x=g.groups[Number(rest)];if(x){x.tap=Math.max(0,Math.min(x.n,(x.tap||0)+(kind==="grpU"?1:-1)));}}
    save();return render();}
  if(ds.gc!=null&&g){const x=g.groups[ds.gc];x.c=Math.max(0,x.c+Number(ds.gd));save();return render();}
  if(ds.bf&&g){const o=ds.bf==="on"?g.buff:g.tbuff;o[ds.ax]+=Number(ds.bd);save();return render();}
  if(ds.delgrp!=null&&g){g.groups.splice(Number(ds.delgrp),1);save();return render();}
  if(ds.addcancel&&g){addOpen=null;return render();}
  if(ds.delsrc!=null&&g){g.sources.splice(Number(ds.delsrc),1);keepCarry();save();return render();}
  if(ds.card!=null&&g){const c=cardList(g.deck)[Number(ds.card)];if(c){g.inplay=g.inplay||[];const was=g.inplay.includes(c);g.inplay=was?g.inplay.filter(x=>x!==c):[...g.inplay,c];if(modeOf(g)==="sim")g.hand=Math.max(0,(g.hand||0)+(was?1:-1));save();}
    const before=(document.querySelector(".cardspanel")||{getBoundingClientRect:()=>({top:0})}).getBoundingClientRect().top;render();
    const p2=document.querySelector(".cardspanel");if(p2){const d=p2.getBoundingClientRect().top-before;if(Math.abs(d)>1)window.scrollBy(0,d);}return;}
  if(ds.cat&&g){pickCat=ds.cat;return render();}
  if(ds.ctap&&g){g.cardUsed=g.cardUsed||{};g.cardUsed[ds.ctap]=!g.cardUsed[ds.ctap];save();return render();}
  if(ds.make&&g){const c=cardInfo(g.deck,ds.make);const grp=(g.groups||[]).find(x=>x.name===c.makeGroup)||(g.groups||[])[0];if(c.make&&grp){grp.n+=c.make;save();}return render();}
  if(ds.leave&&g){leaveOpen=leaveOpen===ds.leave?null:ds.leave;return render();}
  if(ds.leaveto&&g&&leaveOpen&&["copy","owner","ogy","oex"].includes(ds.leaveto)){const n=leaveOpen,t=g.took&&g.took[n];leaveOpen=null;
    if(t&&ds.leaveto!=="owner"&&ds.leaveto!=="copy"){g.deadOut=g.deadOut||[];g.deadSeq=(g.deadSeq||0)+1;g.deadOut.push([String(t.n).slice(0,40),String(t.o).slice(0,40),ds.leaveto==="oex"?"ex":"gy",g.deadSeq]);}
    dropTmp(g,n);save();return render();}
  if(ds.leaveto&&g){const n=leaveOpen;leaveOpen=null;if(n&&ds.leaveto!=="cancel"){if(modeOf(g)==="digital"&&(ds.leaveto==="hand"||ds.leaveto==="lib")){const bn=baseName(n);if(ds.leaveto==="hand")g.handCards.push(bn);else g.libCards.unshift(bn);digSync(g);g.deck.cards=(g.deck.cards||[]).filter(x=>!(x.name===n&&x.tmp));}
      else if(modeOf(g)==="sim"){if(ds.leaveto==="hand")g.hand=(g.hand||0)+1;if(ds.leaveto==="lib")g.lib=(g.lib||0)+1;}g.inplay=g.inplay.filter(x=>x!==n);if(g.attach)delete g.attach[n];if(g.cardUsed)delete g.cardUsed[n];if(g.ctr)delete g.ctr[n];
      if(ds.leaveto==="gy"||ds.leaveto==="ex"){g[ds.leaveto].push(n);if(g[ds.leaveto].length>200)g[ds.leaveto].shift();}save();}return render();}
  if(ds.gysel&&g){const [z,i]=ds.gysel.split(":");gySel=gySel&&gySel.z===z&&gySel.i===+i?null:{z,i:+i};return render();}
  if(ds.gyact&&g&&gySel){const arr=g[gySel.z],n=arr[gySel.i];if(n!=null){arr.splice(gySel.i,1);
      if(ds.gyact==="unearth"){g.unearthed=g.unearthed||{};g.unearthed[n]=true;}
      if(ds.gyact==="play"||ds.gyact==="unearth"){const known=cardList(g.deck).includes(n);if(!known){g.deck.cards=g.deck.cards||[];if(!g.deck.cards.some(c=>c.name===n))g.deck.cards.push({name:n,cat:"Other",added:true});}if(!g.inplay.includes(n))g.inplay.push(n);}
      if(ds.gyact==="move")g[gySel.z==="gy"?"ex":"gy"].push(n);save();}gySel=null;return render();}
  if(ds.done!=null&&g){const n=Number(ds.done);g.done=g.done.includes(n)?g.done.filter(x=>x!==n):[...g.done,n];save();return render();}
  if(ds.delfx!=null&&g){g.effects.splice(Number(ds.delfx),1);save();return render();}
  if(ds.delwatch!=null&&g){g.watch.splice(Number(ds.delwatch),1);keepCarry();save();return render();}
  if(ds.delrem!=null){syncDraft();draft.rem.splice(Number(ds.delrem),1);return render();}
  if(ds.color&&view==="setup"){syncDraft();const c=ds.color,cs=draft.colors||[];draft.colors=["W","U","B","R","G"].filter(x=>x===c?!cs.includes(x):cs.includes(x));return render();}
  switch(ds.act){
    case "resume":confirmReset=false;view="hud";wake();break;
    case "endgame":confirmReset="end";break;
    case "endhome":confirmReset="endhome";break;
    case "doend":confirmReset=false;S.game=null;cardOpen=null;save();view="home";window.scrollTo({top:0});break;
    case "closedeck":view=deckView&&deckView.back==="home"?"home":(deckView&&deckView.back)||"home";deckView=null;window.scrollTo({top:0});break;
    case "new":draft={id:"u-"+Date.now(),colors:[],name:"",cmdr:"",mods:["life","cmdr"],custom:[],rem:[],list:""};aiStatus="";view="setup";break;
    case "cancel":view="home";break;
    case "back":view="home";confirmReset=false;break;
    case "next":{if(tableRoom&&(!tblState.turn||tblState.turn===uid)){const ps=seatOrder(tablePeers()),i=ps.findIndex(p=>p.peer===uid);if(ps.length>1&&i>=0)setTbl({turn:ps[(i+1)%ps.length].peer});}
      Object.keys(g.unearthed||{}).forEach(n=>{if(g.inplay.includes(n)){g.inplay=g.inplay.filter(x=>x!==n);g.ex.push(n);}});g.unearthed={};g.turn++;untap(g);g.done=[];Object.keys(MODS).forEach(m=>{if(MODS[m].perTurn&&m in g.vals)g.vals[m]=0;});save();window.scrollTo({top:0});break;}
    case "untapall":g.sources.forEach(s=>s.used=0);g.cardUsed={};if(g.cmdr)g.cmdr.tap=false;if(g.cmdr2)g.cmdr2.tap=false;(g.groups||[]).forEach(x=>x.tap=0);save();break;
    case "tour":endTour();startTour(view==="hud"?"hud":"home");return;
    case "tourno":try{localStorage.setItem("deckhud.tour.home","1");}catch(_){}break;
    case "bug":bugOpen=true;bugSent=false;bugErr="";render();setTimeout(()=>{const t=document.getElementById("bug-msg");if(t)t.focus();},50);return;
    case "closebug":bugOpen=false;break;
    case "sendbug":sendBug();return;
    case "pick":pickOpen=!pickOpen;addStatus="";break;
    case "addcard":addCard();return;
    case "cmdrcast":g.cmdr.on=true;g.cmdr.casts++;save();break;
    case "cmdrback":g.cmdr.on=false;g.cmdr.tap=false;if(g.ctr)delete g.ctr.cmdr;save();break;
    case "cmdrup":g.cmdr.casts++;save();break;
    case "cmdrdown":g.cmdr.casts=Math.max(0,g.cmdr.casts-1);save();break;
    case "browse":catErr="";loadCatalog();return;
    case "createroom":case "joinroom":{const nick=(document.getElementById("tbl-nick").value||"").trim().slice(0,20);
      const room=(document.getElementById("tbl-room").value||"").trim().slice(0,24);
      const key=ds.act==="createroom"?genKey():normKey((document.getElementById("tbl-key")||{}).value);
      if(room.length<2){tableErr="Give the room a name of at least 2 characters.";return refreshTable();}
      if(key.length<6){tableErr="Enter the room's key. It's 8 letters and numbers, like k7pq-3xz9.";return refreshTable();}
      roomCode(room,key).then(code=>{S.table={nick:nick||"Player",room,key,code};save();joinTable(code);});return;}
    case "shareinvite":{const t=S.table||{};const url=location.origin+location.pathname+"#room="+encodeURIComponent(t.room)+"&key="+normKey(t.key);
      try{navigator.share({title:"Join my mtghud room",text:`Join my mtghud room "${t.room}" (key ${fmtKey(t.key)})`,url}).catch(()=>{});}catch(_){}return;}
    case "copyinvite":{const txt=inviteText();copied=false;inviteShow=false;
      try{navigator.clipboard.writeText(txt).then(()=>{copied=true;refreshTable();setTimeout(()=>{copied=false;refreshTable();},2000);},()=>{inviteShow=true;refreshTable();const el=document.getElementById("invite-text");if(el)el.select();});}
      catch(_){inviteShow=true;refreshTable();const el=document.getElementById("invite-text");if(el)el.select();}return;}
    case "tvjoin":{const room=(document.getElementById("tv-room").value||"").trim().slice(0,24),key=normKey(document.getElementById("tv-key").value);
      if(room.length<2||key.length<6){tvErr="Enter the room name and its key.";return render();}
      roomCode(room,key).then(code=>{S.table={...(S.table||{}),room,key,code};joinTable(code).then(render);});return;}
    case "tvexit":leaveTable();history.replaceState(null,"",location.pathname);location.reload();return;
    case "opentv":openTableView();return;
    case "leavetable":leaveTable();S.table={nick:(S.table||{}).nick,room:"",key:"",code:""};inviteShow=false;save();return refreshTable();
    case "addopp":g.opps.push({name:"Opponent",life:40,cd:0});renumberOpps(g);save();break;
    case "undoopp":{const h=(g.hist&&g.hist.length)?g.hist.pop():g.last;if(h&&g.opps[h.i]){const o=g.opps[h.i];o.life=h.life;o.cd=h.cd;if("cd2" in h){o.cd2=h.cd2;o.tk=h.tk;o.tk2=h.tk2;if(h.me!=null)g.vals.life=h.me;}}g.last=null;save();break;}
    case "oppsfromroom":{const ps=seatOrder(peerList.filter(p=>p.kind==="viewer"&&!p.sameTab&&p.presence&&p.presence.b));if(ps.length){
      g.opps=ps.slice(0,5).map(p=>{const nm=String(p.presence.b.nick||"Player").slice(0,20),old=g.opps.find(o=>o.name===nm);return old||{name:nm,life:Number(p.presence.b.life)||40,cd:0};});g.hist=[];save();}break;}
    case "closeterm":termOpen=null;break;
    case "closecard":cardOpen=null;break;
    case "glossary":glossBack=view==="glossary"?glossBack:view;termOpen=null;view="glossary";window.scrollTo({top:0});break;
    case "glossback":view=glossBack==="glossary"?"home":glossBack;break;
    case "reset":confirmReset=true;break;
    case "noreset":confirmReset=false;break;
    case "doreset":confirmReset=false;startGame(g.deck);return;
    case "addrem":{syncDraft();const t=document.getElementById("f-rem").value.trim();const src=document.getElementById("f-remsrc").value.trim().slice(0,60);if(t)draft.rem.push(src?[document.getElementById("f-ph").value,t,src]:[document.getElementById("f-ph").value,t]);break;}
    case "ai":suggest();return;
    case "clearcards":syncDraft();draft.cards=[];draft.groups=[];aiStatus="";break;
    case "savedeck":{syncDraft();if(!draft.name){aiStatus="";document.getElementById("f-name").focus();return;}
      const d={id:draft.id,name:draft.name,cmdr:draft.cmdr,cmdr2:draft.cmdr2||"",kinds:draft.kinds,mods:draft.mods.length?draft.mods:["life"],custom:draft.custom,rem:draft.rem,list:draft.list,colors:draft.colors||[],cards:draft.cards||[],groups:draft.groups||[]};
      const i=S.decks.findIndex(x=>x.id===d.id);if(i>=0)S.decks[i]=d;else S.decks.push(d);save();view="home";break;}
    case "deldeck":S.decks=S.decks.filter(x=>x.id!==draft.id);save();view="home";break;
  }
  render();
});
app.addEventListener("input",e=>{if(e.target.id==="add-card"||e.target.id==="add-gy")onCardSearch(e.target);
  if(e.target.id==="dig-q"){const q=e.target.value.trim().toLowerCase();document.querySelectorAll("#dig-list [data-fname]").forEach(r=>{r.hidden=!!q&&!r.dataset.fname.includes(q);});}});
app.addEventListener("input",e=>{if(e.target.id==="cat-q"){catQuery=e.target.value;const el=document.getElementById("catalog");
  if(el){const pos=e.target.selectionStart;el.innerHTML=catalogHtml();const i=document.getElementById("cat-q");i.focus();try{i.setSelectionRange(pos,pos);}catch(_){}}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(cardOpen||termOpen)){cardOpen=null;termOpen=null;render();}});
app.addEventListener("keydown",e=>{if(e.target.id==="add-card"&&e.key==="Enter"){e.preventDefault();addCard();}});
app.addEventListener("change",e=>{if(e.target.matches("[data-sessrule]")){const x=sessOf();if(x)sessWrite({...x,rule:e.target.value==="winner"?"winner":"first"});return;}
  if(e.target.matches("[data-mod]"))syncDraft();
  if(e.target.matches("[data-oppname]")&&S.game&&S.game.opps){S.game.opps[e.target.dataset.oppname].name=e.target.value.trim().slice(0,24)||"Opponent";save();}
  if(e.target.matches("[data-attach]")&&S.game){S.game.attach=S.game.attach||{};const v=e.target.value;if(v)S.game.attach[e.target.dataset.attach]=v;else delete S.game.attach[e.target.dataset.attach];save();render();}});

if(S.game)view="hud";if(tvMode)view="tv";
addEventListener("hashchange",()=>{const tv=location.hash==="#tv";if(tv!==tvMode){location.reload();}});
render();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
